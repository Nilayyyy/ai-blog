name: Daily post draft

on:
  schedule:
    - cron: "30 2 * * *" # 08:00 IST every day
  workflow_dispatch: # lets you run it manually from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Generate draft
        id: gen
        run: python scripts/generate.py
        env:
          PROVIDER: ${{ vars.PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: draft/${{ github.run_id }}
          title: "Draft: ${{ steps.gen.outputs.title }}"
          commit-message: "Add draft: ${{ steps.gen.outputs.title }}"
          body: |
            New AI-generated draft. Before merging:
            - [ ] Replace the `TODO(nilay)` line in "My take" with your own experience
            - [ ] Check every `<!-- VERIFY: ... -->` note, then delete the marker
            - [ ] Read it once for tone and accuracy

            The post stays hidden from the site until both markers are gone.
          delete-branch: true
